<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление устройством</title><link rel="stylesheet" href="{{.Base}}ui.css"><style>
body{margin:0;background:#f4f7f9;color:#172c3c;font:15px system-ui}main{max-width:1400px;margin:24px auto;padding:0 20px}.card{background:white;border:1px solid #dce5eb;border-radius:12px;padding:20px;margin:16px 0}.toolbar,.tabs{display:flex;gap:10px;flex-wrap:wrap}button,.button{padding:9px 14px;border:0;border-radius:7px;background:#008075;color:white;cursor:pointer;text-decoration:none}button:disabled{opacity:.45;cursor:default}label{display:block;margin:9px 0}input:not([type=checkbox]),select,textarea{box-sizing:border-box;width:100%;padding:8px;border:1px solid #cbd8de;border-radius:6px}input[type=checkbox]{margin-right:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.muted,small{color:#65798a}small{display:block}.error{color:#a02e32}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #e3eaf0;vertical-align:top}.apps{max-height:55vh;overflow:auto}.tabs button[aria-selected=true]{background:#172c3c;color:white}section[hidden]{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{min-height:70px}.profile{border:1px solid #dce5eb;padding:14px;border-radius:8px;margin:12px 0}.danger{background:#a83c42}
</style><main id="mdm-editor" data-base="{{.Base}}" data-id="{{.Device}}" data-csrf="{{.CSRF}}"><nav><a href="{{.Base}}users">Пользователи</a> · <a href="{{.Base}}mdm">MDM-устройства</a></nav><h1 id="title">Управление устройством</h1><p id="message" role="status">Загружаем состояние…</p><div class="tabs" role="tablist"><button data-tab="overview">Обзор</button><button data-tab="config">Конфигурация</button><button data-tab="apps">Приложения</button><button data-tab="telemetry">Телеметрия</button><button data-tab="events">События</button></div>
<section id="overview" class="card"><div id="status"></div><div class="toolbar"><button id="start">Включить VPN</button><button id="stop">Выключить VPN</button><button id="reload">Перечитать настройки</button></div><form method="post" action="{{.Base}}mdm/assign"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="id" value="{{.Device}}"><label>Пользователь<select name="userID"><option value="">Без пользователя</option>{{range .Users}}<option value="{{.ID}}" {{if eq .ID $.UserID}}selected{{end}}>{{.Name}}</option>{{end}}</select></label><button>Сохранить владельца</button></form></section>
<section id="config" class="card" hidden><div id="configuration"></div></section><section id="apps" class="card" hidden><label>Список приложений для<select id="apps-profile"></select></label><label>Поиск<input id="app-search" placeholder="Название или package ID"></label><p id="inventory-note" class="muted"></p><div id="app-list" class="apps"></div></section>
<section id="telemetry" class="card" hidden><p>Настройки сбора и полученные измерения доступны отдельно.</p><a class="button" href="{{.Base}}mdm?device={{.Device}}">Wi-Fi и соты</a></section><section id="events" class="card" hidden><div id="event-list"></div></section>
<section class="card"><div class="toolbar"><button id="preview">Посмотреть изменения</button><button id="apply">Применить</button></div><p id="draft-note" class="muted">Настройки отправляются только после нажатия «Применить». Работающий VPN может кратковременно переподключиться.</p><pre id="diff"></pre></section></main><script src="{{.Base}}mdm-editor.js" defer></script></html>
