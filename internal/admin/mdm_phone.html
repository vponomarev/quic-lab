<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>MDM-настройки</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#1c1c1e;font:16px system-ui}main{padding:12px}h1{font-size:23px}h2{font-size:18px;margin:8px 0}p,small{line-height:1.4;color:#606067}button{font:inherit;border:0;border-radius:10px;padding:12px;color:#008075;background:#fff;min-height:48px}button:disabled{opacity:.45}.tabs{display:flex;gap:5px;position:sticky;top:0;background:#f2f2f7;padding:6px 0;z-index:2}.tabs button{flex:1;font-size:14px;padding:10px 5px}.tabs [aria-selected=true],#apply{background:#008075;color:white}.card,.config-panel,.profile{background:white;border-radius:12px;padding:12px;margin:12px 0}.config-panel .grid{display:block}label{display:block;margin:10px 0}input:not([type=checkbox]),select,textarea{display:block;width:100%;font:inherit;border:1px solid #c8c8cc;border-radius:7px;padding:10px;min-height:46px;margin-top:5px}input[type=checkbox]{width:22px;height:22px;margin-right:8px;vertical-align:middle}.check{display:flex;align-items:center}textarea{min-height:90px;font-family:monospace;font-size:14px}details{margin:12px 0}summary{padding:9px 0;cursor:pointer}table{width:100%;font-size:13px}td,th{padding:6px 2px}.danger,.error{color:#a02e32}.apply-bar{position:sticky;bottom:0;background:#f2f2f7;border-top:1px solid #ddd;padding:8px 0;z-index:3}.toolbar{display:flex;gap:8px}.toolbar button{flex:1}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow:auto;font-size:12px}.apps label{padding:8px 0;border-bottom:1px solid #eee}#status{font-size:14px;line-height:1.4}#message{font-size:14px;overflow-wrap:anywhere}[hidden]{display:none!important}
</style></head><body><main id="mdm-editor" data-phone="true" data-temporary="false" data-base="/" data-id="" data-csrf="">
<h1 id="title">MDM-настройки</h1><p id="message" role="status">Получаем настройки с сервера…</p>
<div class="tabs"><button data-tab="overview" aria-selected="true">Состояние</button><button data-tab="config">Настройки</button><button data-tab="apps">Приложения</button></div>
<section id="overview" class="card"><div id="status" aria-live="polite"></div><button id="reload">Перечитать настройки</button><p>Изменения отправляются MDM-серверу. Телефон применяет полученную от сервера версию. Во время применения VPN может переподключиться.</p></section>
<section id="config" hidden><div id="configuration"></div></section>
<section id="apps" class="card" hidden><label>Список для<select id="apps-profile"></select></label><label>Поиск<input id="app-search" placeholder="Название или package ID"></label><p id="inventory-note"></p><div id="app-list" class="apps"></div></section>
<section class="apply-bar"><div class="toolbar"><button id="preview">Изменения</button><button id="apply" disabled>Отправить</button></div><p id="draft-note">Черновик не меняет действующие настройки.</p><pre id="diff"></pre></section>
<div hidden><button id="start"></button><button id="stop"></button><button id="export-config"></button><button id="import-config"></button><section id="telemetry" hidden></section></div>
</main><script src="/mdm_editor.js" defer></script></body></html>
