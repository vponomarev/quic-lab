# Optional drop-in: quic-lab-client.service.d/per-app.conf.
# Full process/file visibility is required for per-app attribution across users.
[Service]
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
ProtectHome=read-only
PrivateTmp=false
ProtectProc=default
ProcSubset=all
