server {
    listen 80;
    listen [::]:80;
    server_name quic.example.org;
    root /var/www/quic-demo;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://quic.example.org$request_uri; }
}

server {
    ssl_protocols TLSv1.2 TLSv1.3;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quic.example.org;
    ssl_certificate /etc/letsencrypt/live/quic.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quic.example.org/privkey.pem;
    location = /echo {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 95s;
        proxy_send_timeout 95s;
        proxy_buffering off;
    }
    location / {
        default_type text/plain;
        return 200 "QUIC Lab\nAndroid echo endpoint: quic.example.org:4433/UDP\nTLS hostname: quic.example.org\nCertificate: Let's Encrypt; no fingerprint needed.\n";
    }
}
